# PR-12.4 生产环境配置
# 环境隔离铁律：
#   1. 生产环境只能通过 SPRING_PROFILES_ACTIVE=prod 激活本文件；
#   2. 禁止在生产加载 test / demo profile（application-test.yml 位于 src/test，
#      不会被打入生产 jar；demo seeder 通过 @Profile("demo") 双重隔离）；
#   3. 所有凭据必须来自环境变量，本文件不允许出现明文密钥。
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/diagnosis?characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
  session:
    store-type: redis
    timeout: 2592000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      database: 8
      password: ${REDIS_PASSWORD:}
      connect-timeout: 3000
  ai:
    vectorstore:
      chroma:
        client:
          host: ${CHROMA_HOST}
          port: ${CHROMA_PORT:8000}
        tenant-name: default_tenant
        database-name: default_database
        collection-name: diagnosis-knowledge
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-plus
          temperature: 0.3
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      embedding:
        enabled: true
        options:
          model: text-embedding-v3

cos:
  client:
    host: ${COS_HOST}
    secretId: ${COS_SECRET_ID}
    secretKey: ${COS_SECRET_KEY}
    region: ${COS_REGION:ap-guangzhou}
    bucket: ${COS_BUCKET}

diagnosis:
  grpc:
    host: ${GRPC_HOST:127.0.0.1}
    port: ${GRPC_PORT:50051}
    deadline-ms: 10000

eye-diagnosis:
  vision-recognition:
    base-url: https://dashscope.aliyuncs.com/compatible-mode
    api-key: ${DASHSCOPE_API_KEY}
    model: qwen-vl-plus

workflow:
  execution:
    enabled: true

demo:
  seed:
    enabled: false

mybatis-plus:
  configuration:
    # 生产关闭 SQL stdout 日志
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    com.csust.eyediagnosis: info
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: warn

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
