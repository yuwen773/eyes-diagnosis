# 服务器部署配置示例（请复制为 application-server.yml 并填写真实凭据）
# 真实文件 application-server.yml 已加入 .gitignore，请勿提交到仓库
spring:
  datasource:
    url: jdbc:mysql://<host>:3306/diagnosis?characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: <db-user>
    password: <db-password>
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
  session:
    store-type: redis
    timeout: 2592000
  data:
    redis:
      host: <redis-host>
      port: 6379
      database: 8
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          max-wait: -1
      connect-timeout: 3000
  ai:
    vectorstore:
      chroma:
        client:
          host: <chroma-host>
          port: 8000
        tenant-name: default_tenant
        database-name: default_database
        collection-name: diagnosis-knowledge
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen3.5-plus
          temperature: 0.3
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      embedding:
        enabled: true
        options:
          model: text-embedding-v3
    rerank:
      options:
        model: gte-rerank-v2
      top-n: 5
      return-documents: true

cos:
  client:
    host: <cos-host>
    secretId: ${COS_SECRET_ID}
    secretKey: ${COS_SECRET_KEY}
    region: <cos-region>
    bucket: <cos-bucket>

diagnosis:
  grpc:
    host: 127.0.0.1
    port: 50051
    deadline-ms: 10000

eye-diagnosis:
  vision-recognition:
    base-url: https://dashscope.aliyuncs.com/compatible-mode
    api-key: ${DASHSCOPE_API_KEY}
    model: qwen-vl-plus
  rag:
    chunk-size: 800
    chunk-overlap: 100
    search:
      top-k: 20
      final-top-k: 5
      similarity-threshold: 0.5
    rerank:
      enabled: true
      model: gte-rerank-v2
    hybrid-search:
      enabled: true
      rrf-k: 60

logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: debug
    com.csust.eyediagnosis.service.impl.DocumentProcessingService: info
