# PR-12.4 演示环境配置（docker compose 内使用）
# 环境隔离：demo 是独立 profile，绝不引用 test 配置；凭据全部走环境变量。
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/diagnosis?characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:yuwen123.}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
  session:
    store-type: redis
    timeout: 2592000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 8
      connect-timeout: 3000
  ai:
    vectorstore:
      chroma:
        client:
          host: ${CHROMA_HOST:http://localhost}
          port: ${CHROMA_PORT:8000}
        tenant-name: default_tenant
        database-name: default_database
        collection-name: diagnosis-knowledge
        initialize-schema: true
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY:demo-placeholder-key}
      chat:
        options:
          model: qwen-plus
          temperature: 0.3
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:demo-placeholder-key}
      embedding:
        enabled: true
        options:
          model: text-embedding-v3

cos:
  client:
    host: ${COS_HOST:https://cos.demo.invalid}
    secretId: ${COS_SECRET_ID:demo-placeholder}
    secretKey: ${COS_SECRET_KEY:demo-placeholder}
    region: ${COS_REGION:ap-guangzhou}
    bucket: ${COS_BUCKET:demo-bucket}

diagnosis:
  grpc:
    host: ${GRPC_HOST:127.0.0.1}
    port: ${GRPC_PORT:50051}
    deadline-ms: 10000

eye-diagnosis:
  vision-recognition:
    base-url: https://dashscope.aliyuncs.com/compatible-mode
    api-key: ${DASHSCOPE_API_KEY:demo-placeholder-key}
    model: qwen-vl-plus

workflow:
  execution:
    enabled: true

# 演示数据种子开关（DemoDataSeeder 仅在 demo profile 生效）
demo:
  seed:
    enabled: true

logging:
  level:
    com.csust.eyediagnosis: info
