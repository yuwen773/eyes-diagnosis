spring:
  datasource:
    url: jdbc:mysql://localhost:3306/diagnosis?characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
  session:
    store-type: redis
    timeout: 2592000
  #redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 8
      ttl: 3600
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          max-wait: -1
      connect-timeout: 3000
  ai:
    vectorstore:
      chroma:
        client:
          host: http://localhost
          port: 8000
        collection-name: eye-diagnosis-knowledge