server:
  # 端口
  port: 8081
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
spring:
  servlet:
    multipart:
      # 上传文件最大大小 10MB
      max-file-size: 10MB
      max-request-size: 11MB
  profiles:
    # 启用配置文件
    active: local,dev
  application:
    name: eye-diagnosis
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration,classpath:db/callback
    schemas: diagnosis
    validate-on-migrate: true
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # 仅在开发环境下开启日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 逻辑删除字段
      logic-delete-value: 1 # 逻辑已删除
      logic-not-delete-value: 0 # 逻辑未删除字段
# 接口文档配置
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.csust.eyediagnosis.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: debug
    com.csust.eyediagnosis.service.impl.DocumentProcessingService: info

# MCP 远程白名单：精确 Origin 列表（如 https://mcp.example.com），默认空（拒绝所有远程）
mcp:
  remote:
    allowed-origins: ${MCP_ALLOWED_ORIGINS:}
  executor:
    core-size: ${MCP_EXECUTOR_CORE:4}
    max-size: ${MCP_EXECUTOR_MAX:16}
    queue-capacity: ${MCP_EXECUTOR_QUEUE:64}
    timeout-seconds: ${MCP_EXECUTOR_TIMEOUT:60}
    per-server-max: ${MCP_PER_SERVER_MAX:8}
  tool-timeout-seconds: ${MCP_TOOL_TIMEOUT:30}

# CORS 精确白名单：仅允许配置的 Origin；未配置环境变量时拒绝所有跨域凭据请求
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# 眼科图像分析配置
# 事务性 Outbox 已退役：t_agent_message_outbox 与 t_agent_message 同库，
# 没有跨系统边界可跨，且原有 dispatcher 会重放历史行。会话消息统一由
# ChatMessageWriter 单事务直写 t_agent_message；表中历史行保留不清理。
agent:
  # 上游模型 reasoning 默认不展示、不落库；显式开启才进入消息流与历史。
  expose-reasoning: false
eye-diagnosis:
  collaboration:
    enabled: false
    admission-enabled: false
    graph-enabled: false
    patient-progress-enabled: false
    clinician-detail-enabled: false
  agent:
    # Chat history uses the ordinary single-write persistence path. Do not
    # enable the legacy dispatcher or it can replay pre-existing Outbox rows.
    outbox:
      enabled: false
  # 上传补偿对账：清理 COS 上没有任务行登记的孤儿图片。
  # 该任务会真实删除对象存储中的文件，默认关闭，需显式开启。
  upload:
    compensation:
      enabled: false
      interval-ms: 3600000
      initial-delay-ms: 600000
      # 宽限期：最近 N 分钟内被修改的对象不参与清理，避免误删正在上传的图片
      min-age-minutes: 30
  inference:
    hash-algorithm: SHA-256
    model-version: efficientnet-b4@1.0.0
    model-weight-sha256: ${MODEL_WEIGHTS_SHA256:}
    preprocess-version: v1
    policy-version: ${INFERENCE_POLICY_VERSION:medical-safety-v3-quality-observe}
  vision-recognition:
    base-url: https://dashscope.aliyuncs.com/compatible-mode
    api-key: your-api-key-here
    model: qwen-vl-plus
  rag:
    chunk-size: 800
    chunk-overlap: 100
    # 内置眼科知识语料（classpath:rag/*.md）播种：开启后启动时切分并写入 ChromaDB。
    # 播种需要调用嵌入模型（产生费用），默认关闭。
    corpus:
      seed-enabled: false
      resource-pattern: classpath*:rag/*.md
    search:
      top-k: 20
      final-top-k: 5
      similarity-threshold: 0.5
    rerank:
      enabled: true
      model: gte-rerank-v2
    hybrid-search:
      enabled: true
      rrf-k: 60
    evaluation:
      enabled: false
