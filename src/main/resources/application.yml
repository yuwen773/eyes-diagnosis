server:
  # 端口
  port: 8081
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
spring:
  servlet:
    multipart:
      # 上传文件最大大小 10MB
      max-file-size: 10MB
  profiles:
    # 启用配置文件
    active: local,dev
  application:
    name: eye-diagnosis
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # 仅在开发环境下开启日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 逻辑删除字段
      logic-delete-value: 1 # 逻辑已删除
      logic-not-delete-value: 0 # 逻辑未删除字段
# 接口文档配置
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.csust.eyediagnosis.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: debug
    com.csust.eyediagnosis.service.impl.DocumentProcessingService: info

# MCP 远程白名单：精确 Origin 列表（如 https://mcp.example.com），默认空（拒绝所有远程）
mcp:
  remote:
    allowed-origins: ${MCP_ALLOWED_ORIGINS:}

# 眼科图像分析配置
eye-diagnosis:
  vision-recognition:
    base-url: https://dashscope.aliyuncs.com/compatible-mode
    api-key: your-api-key-here
    model: qwen-vl-plus
  rag:
    chunk-size: 800
    chunk-overlap: 100
    search:
      top-k: 20
      final-top-k: 5
      similarity-threshold: 0.5
    rerank:
      enabled: true
      model: gte-rerank-v2
    hybrid-search:
      enabled: true
      rrf-k: 60
    evaluation:
      enabled: false