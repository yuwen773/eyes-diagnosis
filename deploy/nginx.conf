# Nginx front door for the split backend.
#
# The Java app and the Python service are both behind this one listener, so the
# browser keeps talking to a single origin and the frontend needs no change:
# `API_BASE_URL` stays `http://localhost:8081/api` (or `/api` in production).
#
# Ports (docs/migration-decisions.md):
#   8081  this listener        <- Java used to own this port directly
#   8082  Java (set SERVER_PORT=8082 when starting it behind this listener)
#   8080  Python / FastAPI
#   5173  Vite dev server (dev only; in production this file serves frontend/dist)
#   8000  ChromaDB
#   3306  MySQL     6379  Redis
#
# Routing table -- two rules, and the order they are matched in matters:
#
#   /api/agent/chat/stream -> Python (longest prefix; SSE, unbuffered)
#   /api/                  -> Python everything else
#
# Nginx resolves the longest prefix first, so `/api/agent/chat/stream` beats
# `/api/agent/`, which beats `/api/`. No dependency on rule order in the file.
#
# Session endpoints: login/logout/get-login were routed to Java by exact-match
# `location` blocks because Spring Session's Redis payload is JDK-serialized and
# unreadable from Python. Python manages its own session namespace now
# (`algorithm/web/session.py`, `eye:py:session:*`), so those blocks are gone and
# the three paths fall through to Python with everything else. The `eye_java`
# upstream is kept -- the Agent subsystem is still being migrated (ticket 08
# removes it).

upstream eye_java {
    # No longer routed to from any location block; retained for the
    # original-Agent rollback path until ticket 08.
    server 127.0.0.1:8082;
    keepalive 16;
}

upstream eye_python {
    # user (14) / diagnosis (8) / news (7) / knowledge (3) / mcp-server (5).
    # One worker, deliberately -- the Snowflake id generator in web/db.py is
    # per-process and needs a distinct worker_id per instance to stay unique.
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 8081;
    server_name _;

    # Mirrors `spring.servlet.multipart.max-file-size: 10MB`
    # (application.yml:14). Without this, nginx rejects a 10 MB upload with its
    # own 413 before Java or Python ever sees it -- and the frontend's response
    # interceptor does not handle a non-JSON 413 body.
    client_max_body_size 10m;

    # Java's server.tomcat default; keeps a slow downstream from pinning a
    # worker indefinitely. The SSE location overrides this.
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # --- SSE: longest prefix under /api/agent/, so it wins over the next rule
    #
    # `proxy_buffering off` is the hard requirement. Buffered, the token stream
    # accumulates and is flushed as one response when the model finishes --
    # the Agent chat appears to hang and then dump its whole answer at once.
    location /api/agent/chat/stream {
        proxy_pass http://eye_python;
        include /etc/nginx/snippets/eye-proxy-headers.conf;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;

        # A single answer can take minutes; the default 60s would cut it off
        # mid-sentence and the client would see a truncated message.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Agent subsystem: everything else under /api/agent/ -----------------
    location /api/agent/ {
        proxy_pass http://eye_python;
        include /etc/nginx/snippets/eye-proxy-headers.conf;
    }

    # --- everything else: Python -------------------------------------------
    #
    # DELETE carries a body here (`DELETE /api/knowledge/delete` with
    # `{"id": ...}`), which is unusual and is dropped by some proxies. nginx
    # forwards it: `proxy_pass` sends the request body for every method, and
    # nothing in this block interferes. `test_deploy_nginx.py` asserts the
    # config does not silently enable request buffering that would break it.
    location /api/ {
        proxy_pass http://eye_python;
        include /etc/nginx/snippets/eye-proxy-headers.conf;
    }

    # Liveness for the Python service, used by the cutover runbook to decide
    # whether the backend is up before flipping a location to it.
    location = /health {
        proxy_pass http://eye_python;
        include /etc/nginx/snippets/eye-proxy-headers.conf;
        access_log off;
    }

    # --- static frontend ----------------------------------------------------
    #
    # Active in production only. In development the Vite dev server on :5173
    # serves these and talks to this listener for /api.
    #
    #   npm run build            (in frontend/)
    #   root /srv/eye-diagnosis/frontend/dist;
    location / {
        root /srv/eye-diagnosis/frontend/dist;
        # SPA history fallback: /news/123 and /admin/... are client routes.
        try_files $uri $uri/ /index.html;

        # Hashed asset filenames from Vite -- safe to cache indefinitely.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
