# Shared proxy headers for both backends.
#
# `Host` is passed through unchanged rather than rewritten to the upstream
# name: Spring Session's DefaultCookieSerializer derives the session cookie's
# domain from the request, and the cookie's Path is `/api` from
# `server.servlet.context-path` (application.yml:5). Rewriting the host would
# make the browser reject a cookie it is already carrying.
#
# `X-Forwarded-*` are set so either backend can log the real client address.
# Neither trusts them for authorisation -- `@AuthCheck` reads the session, and
# Python forwards the cookie to Java (web/auth.py) -- so spoofing them changes
# nothing but the access log.

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# 1.1 is required for keepalive to the upstream and for chunked responses.
proxy_http_version 1.1;
proxy_set_header Connection "";
