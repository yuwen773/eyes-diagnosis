name: Python real services

on:
  pull_request:
    paths:
      - 'algorithm/web/**'
      - 'algorithm/requirements-web*'
      - 'deploy/**'
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/python-real-services.yml'
  workflow_dispatch:
    inputs:
      real_embedding:
        description: 'Require real DashScope embedding and legacy Java reader acceptance'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: issue19-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pissue19-ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      REAL_SERVICES_MYSQL_ADMIN_URL: mysql+pymysql://root:issue19-ci@127.0.0.1:3306
      REQUIRE_REAL_EMBEDDING: ${{ github.event_name == 'workflow_dispatch' && inputs.real_embedding }}
      # Repository secrets are used only by the explicitly requested provider run.
      DASHSCOPE_API_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.real_embedding && secrets.DASHSCOPE_API_KEY || '' }}
    defaults:
      run:
        working-directory: algorithm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: algorithm/requirements-web.lock
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: python -m pip install -r requirements-web.lock
      - name: Install pinned non-JVM DOC converter
        run: |
          curl --fail --location --retry 3 https://download.documentfoundation.org/libreoffice/stable/26.2.6/deb/x86_64/LibreOffice_26.2.6_Linux_x86-64_deb.tar.gz -o "$RUNNER_TEMP/libreoffice-doc.tar.gz"
          python -m web.doc_tool --archive "$RUNNER_TEMP/libreoffice-doc.tar.gz"
      - name: Run real infrastructure with separately labelled model gates
        shell: python
        run: |
          import json, os, subprocess, sys
          from pathlib import Path
          required = os.environ['REQUIRE_REAL_EMBEDDING'] == 'true'
          output = Path('../.scratch/python-agent-migration/evidence/issue19/ci')
          run = subprocess.run([sys.executable, '-m', 'web.verify_real_services',
              '--output-dir', str(output), '--embedding-mode', 'real' if required else 'controlled'])
          report = json.loads((output / 'results.json').read_text())
          if required:
              assert run.returncode == 0 and report['gates']['realEmbedding']['status'] == 'PASS'
          else:
              assert run.returncode == 2 and report['status'] == 'BLOCKED'
              for name in ['infrastructure', 'orchestration', 'mysqlSemantics']:
                  assert report['gates'][name]['status'] == 'PASS', name
              print('Real infrastructure PASS; real embedding/classifier/LLM NOT VERIFIED in this CI mode.')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue19-service-gates
          path: |
            .scratch/python-agent-migration/evidence/issue19/ci/results.json
            .scratch/python-agent-migration/evidence/issue19/ci/source-sha256.json
          if-no-files-found: error
