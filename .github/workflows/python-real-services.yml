name: Python real services
on:
  pull_request:
    paths: ['algorithm/web/**', 'algorithm/requirements-web*', 'contracts/**', 'scripts/**', 'deploy/**', 'pyproject.toml', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target web -f deploy/python/Dockerfile -t eye-python:ticket06 .
      - run: docker build -f deploy/python/Verify.Dockerfile -t eye-verify:ticket06 .
      - name: Isolated MySQL and JVM-free API / Worker acceptance
        run: |
          docker run -d --name eye-ci-mysql -e MYSQL_ROOT_PASSWORD=isolated-ci mysql:8.0.26
          for attempt in $(seq 1 60); do
            if docker exec eye-ci-mysql mysqladmin ping -h 127.0.0.1 -pisolated-ci --silent; then break; fi
            sleep 2
          done
          mkdir -p .scratch/python-project-migration/evidence/issue06/ci
          docker run --rm --network container:eye-ci-mysql \
            -e REAL_SERVICES_MYSQL_ADMIN_URL=mysql+pymysql://root:isolated-ci@127.0.0.1:3306 \
            -v "$PWD/.scratch/python-project-migration/evidence/issue06/ci:/evidence" \
            eye-verify:ticket06 python scripts/verify.py infrastructure --output-dir /evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-infrastructure-gates
          path: |
            .scratch/python-project-migration/evidence/issue06/ci/services/results.json
            .scratch/python-project-migration/evidence/issue06/ci/handoff.xml
          if-no-files-found: error
      - if: always()
        run: docker stop eye-ci-mysql
