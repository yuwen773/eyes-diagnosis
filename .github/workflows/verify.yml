name: verify
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  python-web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target web -f deploy/python/Dockerfile -t eye-python:ticket06 .
      - run: docker build -f deploy/python/Verify.Dockerfile -t eye-verify:ticket06 .
      - name: Dependency, wheel, contracts, typecheck and full Web regression
        run: |
          mkdir -p .scratch/python-project-migration/evidence/issue06/ci
          docker run --rm -v "$PWD/.scratch/python-project-migration/evidence/issue06/ci:/evidence" \
            eye-verify:ticket06 python scripts/verify.py web --output-dir /evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-web-regression
          path: .scratch/python-project-migration/evidence/issue06/ci/web.xml
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv pip install --system -r algorithm/requirements-web.lock
      - run: uv pip install --system --no-deps -e .
      - run: npm ci
        working-directory: frontend
      - run: python scripts/verify.py frontend
      - run: git diff --exit-code -- frontend/src/api
      - run: docker build -f deploy/python/Frontend.Dockerfile -t eye-frontend:ticket06 .
  cpu-package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
      - run: uv pip install --system -r algorithm/requirements-web.lock
      - run: uv pip install --system --no-deps -e .
      - run: docker build --target cpu -f deploy/python/Dockerfile -t eye-python-cpu:ticket06 .
      - run: >-
          docker run --rm eye-python-cpu:ticket06 python -c
          "import shutil, torch; from eye_disease_model import EyeDiseaseModel;
          assert not shutil.which('java') and torch.version.cuda is None;
          EyeDiseaseModel(pretrained=False)"
      - run: docker build -f deploy/python/Frontend.Dockerfile -t eye-frontend:ticket06 .
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/smoke_compose.py --output-dir .scratch/python-project-migration/evidence/issue06/ci-compose
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-delivery
          path: |
            .scratch/python-project-migration/evidence/issue06/ci-compose/results.json
            .scratch/python-project-migration/evidence/issue06/ci-compose/compose-login.png
  algorithms:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: algorithm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
      - run: uv pip install --system --require-hashes --torch-backend cpu -r requirements-model-linux.lock
      - run: python generate_proto.py
      - run: python -m pytest eye_diagnosis/tests tests eye_diagnosis_p1/tests -m "not slow" -q
  browser-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0.26
        env:
          MYSQL_ROOT_PASSWORD: isolated-ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pisolated-ci --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      HANDOFF_TEST_MYSQL_ADMIN_URL: mysql+pymysql://root:isolated-ci@127.0.0.1:3306
      WAIT_RECOVERY_REDIS_SERVER: /usr/bin/redis-server
      WAIT_RECOVERY_BROWSER: '1'
      HUMAN_WAIT_EVIDENCE_DIR: /tmp/eye-browser-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: uv pip install --system -r algorithm/requirements-web.lock
      - run: uv pip install --system --no-deps -e .
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
        working-directory: frontend
      - run: python -m pytest algorithm/web/tests/test_python_wait_recovery.py -k frozen_wait_upgrade_real_login_and_process_restart -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-wait-recovery
          path: /tmp/eye-browser-evidence/*.png
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest algorithm/eye_diagnosis_p1/tests/test_p2_02a_watchdog_unit.py algorithm/eye_diagnosis_p1/tests/test_p2_02a_watchdog_integration.py -q
