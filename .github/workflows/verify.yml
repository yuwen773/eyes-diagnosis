name: verify

on:
  pull_request:
  push:
    branches: [master]

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: algorithm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            algorithm/requirements.txt
            algorithm/requirements-p1.txt
      - run: python -m pip install -r requirements.txt -r requirements-p1.txt pytest
      - run: python generate_proto.py
      - run: python -m pytest eye_diagnosis/tests tests eye_diagnosis_p1/tests -m "not slow" -q

  watchdog:
    # Dedicated job for the P2-02A T2 subprocess watchdog suite. These
    # tests spawn real subprocesses and exercise POSIX process-group
    # isolation + kill/reap, so they must run on Linux (they skip on
    # Windows). They are marked `slow` and therefore excluded from the
    # `python` job above; this job runs them in full. The watchdog module
    # and its deps (schema, matrix) are pure stdlib, so only pytest is
    # installed here — no torch, no proto codegen.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: algorithm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pyarrow pytest
      - run: >-
          python -m pytest
          eye_diagnosis_p1/tests/test_p2_02a_watchdog_unit.py
          eye_diagnosis_p1/tests/test_p2_02a_watchdog_integration.py
          eye_diagnosis_p1/tests/test_p2_02a_t3_integration.py
          -q

  backend-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - run: mvn clean package -DskipTests

  backend-unit:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: diagnosis_ci
          MYSQL_USER: eyeuser
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      chroma:
        image: ghcr.io/chroma-core/chroma:1.0.0
        ports:
          - 8000:8000
    env:
      SPRING_PROFILES_ACTIVE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - run: timeout 60 bash -c 'until curl -fsS http://localhost:8000/api/v2/heartbeat; do sleep 2; done'
      - run: mvn test

  flyway-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: diagnosis_ci
          MYSQL_USER: eyeuser
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      FLYWAY_TEST_URL: jdbc:mysql://127.0.0.1:3306/diagnosis_ci?serverTimezone=UTC
      FLYWAY_TEST_USERNAME: eyeuser
      FLYWAY_TEST_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - run: mvn -Dtest=FlywayMySqlIntegrationTest test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
