          --health-timeout=5s
          --health-retries=10
    env:
      ISSUE18_TEST_URL: jdbc:mysql://127.0.0.1:3306/issue18_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
