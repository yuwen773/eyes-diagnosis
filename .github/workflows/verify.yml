        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      PRODUCT_ACCEPTANCE_TEST_URL: jdbc:mysql://127.0.0.1:3306/product_acceptance_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - run: mvn -B -Dtest=ProductSchemaTest,CollaborationImagesTest,ProductProviderLedgerTest,AgentSessionAdmissionTest test
      - run: python3 scripts/check_surefire_skips.py target/surefire-reports product

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint:check
      - run: npm run test -- --run
      - run: npm run lint:check
      - run: npm run build

  web:
    # 产品前端（React）。`web/` 从 2026-11-10 起由 git subtree 纳入本仓库，
    # 原来的独立仓库 eyes-diagnosis-web 已归档；CI 只看仓库根的 .github/workflows，
    # 所以 web/.github/ 下的工作流不会生效——门禁统一由这里承担。
    # lint 自 B3 批次起是硬门，不再 continue-on-error。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Check collaboration wire contract
        working-directory: .
        run: python3 scripts/check_collaboration_fixture.py --backend-root . --output target/collaboration-contract.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run lint
