name: verify

on:
  pull_request:
  push:
    branches: [master]

jobs:
  docs-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the architecture design document contract
        run: python3 scripts/check_design_doc.py
      - name: Verify steering docs match migrations and controllers
        run: python3 scripts/check_steering_docs.py
      - name: Verify the gRPC probability scale contract
        run: python3 scripts/check_probability_scale.py
      - name: Verify the report gate unit tests
        run: python3 -m unittest discover -s scripts/tests -p "test_check_*.py"

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: algorithm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            algorithm/requirements.txt
            algorithm/requirements-p1.txt
      - run: python -m pip install -r requirements.txt -r requirements-p1.txt
      - run: python generate_proto.py
      - name: Frozen evaluation CLI entry point
        run: python -m eye_diagnosis.frozen_eval --help
      - name: Frozen evaluation CLI smoke run
        # 权重与冻结 manifest 属于真实数据，不入库，因此 CI 只验证 CLI 入口与
        # "产物缺失即跳过"的路径；完整评估在部署环境用 --weights/--manifest 触发。
        run: python -m eye_diagnosis.frozen_eval --manifest datasets/frozen_validation_manifest.json
      - run: python -m pytest eye_diagnosis/tests tests mcp_server/tests eye_diagnosis_p1/tests -m "not slow" -q

  watchdog:
    # Dedicated job for the P2-02A T2 subprocess watchdog suite. These
    # tests spawn real subprocesses and exercise POSIX process-group
    # isolation + kill/reap, so they must run on Linux (they skip on
    # Windows). They are marked `slow` and therefore excluded from the
    # `python` job above; this job runs them in full. The watchdog module
    # and its deps (schema, matrix) are pure stdlib, so only pytest is
    # installed here — no torch, no proto codegen.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: algorithm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pyarrow pytest
      # test_p2_02c_training_watchdog spawns real child interpreters and
      # signals process groups; it is marked `slow` so the main `python`
      # job skips it. Its deps are stdlib-only, matching this job.
      #
      # test_p2_02c_integration deliberately stays in the `python` job: its
      # child process imports p1.training.cli_formal -> formal_fold_runner,
      # which imports torch. Installing torch here would defeat the point of
      # a lightweight watchdog job.
      - run: >-
          python -m pytest
          eye_diagnosis_p1/tests/test_p2_02a_watchdog_unit.py
          eye_diagnosis_p1/tests/test_p2_02a_watchdog_integration.py
          eye_diagnosis_p1/tests/test_p2_02a_t3_integration.py
          eye_diagnosis_p1/tests/test_p2_02c_training_watchdog.py
          eye_diagnosis_p1/tests/test_gpu_marker_contract.py
          -q

  backend-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - run: mvn clean package -DskipTests

  backend-unit:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: diagnosis_ci
          MYSQL_USER: eyeuser
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      chroma:
        image: ghcr.io/chroma-core/chroma:1.0.0
        ports:
          - 8000:8000
    env:
      SPRING_PROFILES_ACTIVE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - run: timeout 60 bash -c 'until curl -fsS http://localhost:8000/api/v2/heartbeat; do sleep 2; done'
      # A failing Maven run still has to leave reports for the skip gate, so
      # capture the exit code instead of letting `mvn` short-circuit the step.
      - name: Backend unit tests
        run: |
          set +e
          mvn -B test
          echo "$?" > /tmp/mvn-exit-code
      - name: Require no silently skipped or dropped tests
        run: python3 scripts/check_surefire_skips.py target/surefire-reports backend-unit
      - name: Fail the job if Maven failed
        run: test "$(cat /tmp/mvn-exit-code)" -eq 0

  issue17-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_DATABASE: issue17_test
          MYSQL_USER: issue17
          MYSQL_PASSWORD: issue17
          MYSQL_ROOT_PASSWORD: root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysql -h 127.0.0.1 -uissue17 -pissue17 issue17_test -e 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      ISSUE17_TEST_URL: jdbc:mysql://127.0.0.1:3306/issue17_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - name: Verify report gates
        run: python3 -m unittest discover -s scripts/tests -p "test_check_*.py"
      - name: Verify MySQL health check
        env:
          ISSUE17_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: python3 -m unittest discover -s scripts/tests -p test_issue17_mysql_health.py
      - name: Run patient task and recovery tests
        run: mvn -B -Dtest=DiagnosisTaskApiTest,DiagnosisTaskRecoveryTest,CosDiagnosisTaskStorageTest test
      - name: Require all patient task tests to run
        run: python3 scripts/check_issue17_reports.py target/surefire-reports

  issue18-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_DATABASE: issue18_test
          MYSQL_USER: issue18
          MYSQL_PASSWORD: issue18
          MYSQL_ROOT_PASSWORD: root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysql -h 127.0.0.1 -uissue18 -pissue18 issue18_test -e 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      ISSUE18_TEST_URL: jdbc:mysql://127.0.0.1:3306/issue18_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - name: Verify report gates
        run: python3 -m unittest discover -s scripts/tests -p "test_check_*.py"
      - name: Run controlled reference lifecycle and eligibility tests
        run: mvn -B -Dtest=ControlledReferenceApiTest test
      - name: Require every controlled reference case to run
        run: python3 scripts/check_surefire_skips.py target/surefire-reports issue18

  issue19-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_DATABASE: issue19_test
          MYSQL_USER: issue19
          MYSQL_PASSWORD: issue19
          MYSQL_ROOT_PASSWORD: root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysql -h 127.0.0.1 -uissue19 -pissue19 issue19_test -e 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      ISSUE19_TEST_URL: jdbc:mysql://127.0.0.1:3306/issue19_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - name: Verify report gates
        run: python3 -m unittest discover -s scripts/tests -p "test_check_*.py"
      - name: Run four-agent draft, timeout and process recovery tests
        run: mvn -B -Dtest=PatientDraftTest test
      - name: Require every draft case to run
        run: python3 scripts/check_surefire_skips.py target/surefire-reports issue19

  flyway-mysql:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        run-order: [alphabetical, reversealphabetical]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: diagnosis_ci
          MYSQL_USER: eyeuser
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      FLYWAY_TEST_URL: jdbc:mysql://127.0.0.1:3306/diagnosis_ci?serverTimezone=UTC
      FLYWAY_TEST_USERNAME: eyeuser
      FLYWAY_TEST_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - name: Allow disposable empty-schema migration checks
        run: >-
          docker exec ${{ job.services.mysql.id }} mysql -uroot -proot-password
          -e 'GRANT ALL PRIVILEGES ON `diagnosis_ci_empty_%`.* TO "eyeuser"@"%";'
      # Each matrix job runs both suites together, so order dependence cannot hide.
      - run: mvn -B -Dtest=FlywayMySqlIntegrationTest,UploadTaskMapperMySqlIntegrationTest -Dsurefire.runOrder=${{ matrix.run-order }} test
      - name: Require both Flyway suites to run fully
        run: python3 scripts/check_surefire_skips.py target/surefire-reports flyway

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test -- --run
      - run: npm run lint:check
      - run: npm run build
