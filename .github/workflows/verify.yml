      - name: Verify report gates
        run: python3 -m unittest discover -s scripts/tests -p "test_check_*.py"
      - name: Run controlled reference lifecycle and eligibility tests
        run: mvn -B -Dtest=ControlledReferenceApiTest test
      - name: Require every controlled reference case to run
        run: python3 scripts/check_surefire_skips.py target/surefire-reports issue18

  issue19-mysql:
