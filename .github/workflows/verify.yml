name: verify

on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend-and-algorithm:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: diagnosis_ci
          MYSQL_USER: eyeuser
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      FLYWAY_TEST_URL: jdbc:mysql://127.0.0.1:3306/diagnosis_ci?serverTimezone=UTC
      FLYWAY_TEST_USERNAME: eyeuser
      FLYWAY_TEST_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: algorithm/requirements.txt
      - run: python -m pip install -r algorithm/requirements.txt
      - run: python algorithm/generate_proto.py
      - run: python -m pytest algorithm/eye_diagnosis/tests algorithm/tests -q
      - run: mvn clean package -DskipTests
      - run: mvn "-Dtest=InferenceCacheTest,FlywayMySqlIntegrationTest" test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
