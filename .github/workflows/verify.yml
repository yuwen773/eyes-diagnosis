          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      COLLABORATION_TEST_URL: jdbc:mysql://127.0.0.1:3306/collaboration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - name: Run durable events, authorization, cancellation and HTTP SSE tests
        run: mvn -B -Dtest=CollaborationRunTest test
      - name: Require every collaboration case to run
        if: always()
        run: python3 scripts/check_surefire_skips.py target/surefire-reports collaboration

  graph-execution-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_DATABASE: graph_execution_test
          MYSQL_USER: graph_execution
          MYSQL_PASSWORD: graph_execution
          MYSQL_ROOT_PASSWORD: root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysql -h 127.0.0.1 -ugraph_execution -pgraph_execution graph_execution_test -e 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      GRAPH_EXECUTION_TEST_URL: jdbc:mysql://127.0.0.1:3306/graph_execution_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - name: Run Graph equivalence, process-death recovery and fencing
        # Only this disposable service enables the failure-injection trigger.
        # The application's database account keeps schema-only privileges.
        run: |
          docker exec ${{ job.services.mysql.id }} mysql -uroot -proot-password -e 'SET GLOBAL log_bin_trust_function_creators=1'
          mvn -B -Dtest=GraphExecutionTest,RealtimeGraphSpikeTest,CoordinationPocTest test
      - name: Require every Graph case to run
        if: always()
        run: python3 scripts/check_surefire_skips.py target/surefire-reports graph-execution

  issue24-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_DATABASE: issue19_test
          MYSQL_USER: issue19
          MYSQL_PASSWORD: issue19
          MYSQL_ROOT_PASSWORD: root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysql -h 127.0.0.1 -uissue19 -pissue19 issue19_test -e 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      ISSUE19_TEST_URL: jdbc:mysql://127.0.0.1:3306/issue19_test
      ISSUE21_TEST_URL: jdbc:mysql://127.0.0.1:3306/issue21_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create the isolated patient HTTP database
        env:
          MYSQL_PWD: root-password
        run: |
          mysql -h 127.0.0.1 -uroot <<'SQL'
          CREATE DATABASE issue21_test;
          CREATE USER 'issue21'@'%' IDENTIFIED BY 'issue21';
          GRANT ALL ON issue21_test.* TO 'issue21'@'%';
          SQL
      - name: Verify the public evaluation CLI
        run: python3 -m unittest discover -s scripts/tests -p 'test_evaluate_agent_collaboration.py'
      - name: Run current coordinator and patient HTTP reliability cases
        run: mvn -B -Dtest=PatientDraftTest,PatientExplanationApiTest test
      - name: Require complete zero-skip reliability evidence
        if: always()
        run: |
          python3 scripts/check_surefire_skips.py target/surefire-reports issue19
          python3 scripts/check_surefire_skips.py target/surefire-reports issue21
      - name: Execute fixed scripted role ablations and import current reliability results
        if: always()
        run: >-
          python3 scripts/evaluate_agent_collaboration.py
          --corpus evaluation/agent-collaboration/corpus.json
          --surefire-dir target/surefire-reports
          --output target/agent-collaboration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue24-evaluation
          path: |
            target/agent-collaboration/
            target/surefire-reports/TEST-*.xml
          if-no-files-found: error

  issue20-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: issue20_test
          MYSQL_USER: issue20
          MYSQL_PASSWORD: issue20
          MYSQL_ROOT_PASSWORD: root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysql -h 127.0.0.1 -uissue20 -pissue20 issue20_test -e 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      ISSUE20_TEST_URL: jdbc:mysql://127.0.0.1:3306/issue20_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - name: Run doctor authorization, frozen review and concurrent decision tests
        run: mvn -B -Dtest=DoctorReviewApiTest test
      - name: Require every review case to run
        run: python3 scripts/check_surefire_skips.py target/surefire-reports issue20

  issue21-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_DATABASE: issue21_test
          MYSQL_USER: issue21
          MYSQL_PASSWORD: issue21
          MYSQL_ROOT_PASSWORD: root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysql -h 127.0.0.1 -uissue21 -pissue21 issue21_test -e 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      ISSUE21_TEST_URL: jdbc:mysql://127.0.0.1:3306/issue21_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - name: Run patient visibility, citation authorization and live release gate tests
        run: mvn -B -Dtest=PatientExplanationApiTest test
      - name: Require every patient explanation case to run
        run: python3 scripts/check_surefire_skips.py target/surefire-reports issue21

  issue22-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_DATABASE: issue22_test
          MYSQL_USER: issue22
          MYSQL_PASSWORD: issue22
          MYSQL_ROOT_PASSWORD: root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysql -h 127.0.0.1 -uissue22 -pissue22 issue22_test -e 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      ISSUE22_TEST_URL: jdbc:mysql://127.0.0.1:3306/issue22_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - name: Enable fault injection on this disposable MySQL service
        run: docker exec ${{ job.services.mysql.id }} mysql -uroot -proot-password -e 'SET GLOBAL log_bin_trust_function_creators=1'
      - name: Run patient consent, rollback, frozen save and concurrent receipt tests
        run: mvn -B -Dtest=PatientAuthorizationApiTest test
      - name: Require every patient authorization case to run
        run: python3 scripts/check_surefire_skips.py target/surefire-reports issue22

  issue23-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_DATABASE: issue23_test
          MYSQL_USER: issue23
          MYSQL_PASSWORD: issue23
          MYSQL_ROOT_PASSWORD: root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysql -h 127.0.0.1 -uissue23 -pissue23 issue23_test -e 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      ISSUE23_TEST_URL: jdbc:mysql://127.0.0.1:3306/issue23_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - name: Run patient follow-up scope, live evidence and read-only invariant tests
        run: mvn -B -Dtest=PatientFollowUpApiTest test
      - name: Require every patient follow-up case to run
        run: python3 scripts/check_surefire_skips.py target/surefire-reports issue23

  flyway-mysql:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        run-order: [alphabetical, reversealphabetical]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: diagnosis_ci
          MYSQL_USER: eyeuser
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      FLYWAY_TEST_URL: jdbc:mysql://127.0.0.1:3306/diagnosis_ci?serverTimezone=UTC
      FLYWAY_TEST_USERNAME: eyeuser
      FLYWAY_TEST_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - name: Allow disposable empty-schema migration checks
        run: >-
          docker exec ${{ job.services.mysql.id }} mysql -uroot -proot-password
          -e 'GRANT ALL PRIVILEGES ON `diagnosis_ci_empty_%`.* TO "eyeuser"@"%";'
      # Each matrix job runs both suites together, so order dependence cannot hide.
      - run: mvn -B -Dtest=FlywayMySqlIntegrationTest,UploadTaskMapperMySqlIntegrationTest -Dsurefire.runOrder=${{ matrix.run-order }} test
      - name: Require both Flyway suites to run fully
        run: python3 scripts/check_surefire_skips.py target/surefire-reports flyway

  product-contract:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: product_acceptance_test
          MYSQL_USER: product_acceptance
          MYSQL_PASSWORD: product_acceptance
          MYSQL_ROOT_PASSWORD: root-password
        ports:
