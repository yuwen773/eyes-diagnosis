<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 品牌标 v1.0：.ico 覆盖浏览器标签栏，磁贴供 iOS/Android 主屏。 -->
    <link rel="icon" href="/brand/iris-favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/brand/iris-app-tile-180.png" />
    <!-- 光幕底图不预载：只属落地页、且滚动到首屏之下才挂载，按主题由 <img src> 自然触发。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 品牌画布色；内联脚本会按应用内实际主题改写（不只看系统偏好）。 -->
    <meta name="theme-color" content="#f2f6fc" />
    <meta
      name="description"
      content="Iris · 眼底影像判读。上传彩色眼底照片，获得八类常见眼底改变的判读、质量门与可追溯的判读记录。"
    />
    <title>Iris · 眼底影像判读</title>
    <script>
      // 防闪烁：在样式表应用前先把主题类挂到 <html> 上，与 ThemeProvider 的 storageKey 一致。
      (function () {
        try {
          var t = localStorage.getItem("theme")
          var dark =
            t === "dark" ||
            (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)
          if (dark) document.documentElement.classList.add("dark")
          else document.documentElement.classList.add("light")
          // theme-color 跟应用内主题走：手机地址栏/系统 UI 与首屏画布同色。
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute("content", dark ? "#0b1425" : "#f2f6fc")
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
